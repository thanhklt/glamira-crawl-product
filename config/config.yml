mongodb:
  # Không ghi username/password thật vào file này. Dùng các biến môi trường:
  # MONGODB_URI (URL đầy đủ), hoặc MONGODB_USERNAME + MONGODB_PASSWORD.
  uri: mongodb://136.85.113.80:27017/?authSource=admin
  auth_source: admin
  db: countly
  collection: summary
  batch_size: 2000

discovery:
  # Giữ vài URL dự phòng cho mỗi product_id, phòng URL đầu tiên không còn hoạt động.
  max_urls_per_product: 3
  checkpoint_every: 2000

crawler:
  # Bốn curl-cffi AsyncSession độc lập, mỗi worker giữ cookie jar riêng.
  concurrency: 10
  # Mọi request được giãn tối thiểu delay + một khoảng jitter ngẫu nhiên.
  request_delay_seconds: 0
  request_jitter_seconds: 0
  request_timeout_seconds: 30
  retries: 3
  retry_backoff_seconds: 1.0
  # Dùng TLS/HTTP2 fingerprint của Chrome; User-Agent vẫn xoay vòng bên dưới.
  curl_impersonate: chrome
  # Chỉ các HTTP status tạm thời này mới retry cùng URL. 401/403/404 không retry.
  retry_http_statuses: [429, 500, 502, 503, 504]
  # UA lấy từ Chrome/Edge cài thật trên máy. Chrome/Chromium áp dụng UA reduction
  # nên navigator.userAgent chỉ hiển thị major version và 0.0.0 ở phần còn lại.
  # Xoay vòng theo product; mỗi UA có session/cookie jar riêng.
  user_agents:
    - Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36
    - Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36 Edg/151.0.0.0
  fallback_product_url_template: https://www.glamira.co.uk/catalog/product/view/id/{product_id}

storage:
  state_db: ../data/crawl-state.sqlite3
  output: ../data/products.jsonl
  failed_urls_output: ../data/failed-urls.jsonl

logging:
  # DEBUG: chi tiết request/retry; INFO: từng sản phẩm/URL; WARNING: chỉ lỗi.
  level: INFO

# Để trống/null nếu muốn lưu toàn bộ object sản phẩm trả về từ react_data_url.
product_fields:
  - product_id
  - name
  - sku
  - attribute_set_id
  - attribute_set
  - type_id
  - price
  - min_price
  - max_price
  - min_price_format
  - max_price_format
  - gold_weight
  - none_metal_weight
  - fixed_silver_weight
  - material_design
  - qty
  - collection
  - collection_id
  - product_type
  - product_type_value
  - category
  - category_name
  - store_code
  - platinum_palladium_info_in_alloy
  - bracelet_without_chain
  - show_popup_quantity_eternity
  - visible_contents
  - gender
  - configure_mode
  - included_chain_weight
